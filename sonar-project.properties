# SonarQube Cloud configuration
sonar.organization=salvanescki
sonar.projectKey=salvanescki_dapps2026GrupoQ

# Source and Test directories
sonar.sources=backend/src,frontend/src
sonar.tests=backend/test,frontend/tests

# Inclusions and exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.test.tsx,**/*.test.ts,frontend/src/vite-env.d.ts
sonar.test.inclusions=backend/test/**/*.spec.ts,frontend/tests/**/*.test.{ts,tsx},frontend/tests/**/*.spec.{ts,tsx}

# Test coverage reporting (LCOV format)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,backend/coverage/unit/lcov.info,backend/coverage/integration/lcov.info,backend/coverage/e2e/lcov.info,frontend/coverage/lcov.info,frontend/coverage/unit/lcov.info,frontend/coverage/integration/lcov.info,frontend/coverage/e2e/lcov.info
