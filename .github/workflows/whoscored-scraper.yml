name: WhoScored Scraper

on:
  schedule:
    - cron: '0 2 * * 0' # Cada domingo a las 02:00 UTC (cada 7 días)
  workflow_dispatch: # Disparo manual administrativo

permissions:
  contents: read

jobs:
  scrape:
    name: Run WhoScored Scraping Pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium with system dependencies
        run: npx playwright install chromium --with-deps

      - name: Build backend application
        run: npm run build

      - name: Run Scraper
        env:
          NODE_ENV: production
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '5432' }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          WHOSCORED_SEASON_LABEL: ${{ vars.WHOSCORED_SEASON_LABEL || '2025/2026' }}
          WHOSCORED_DELAY_MIN_MS: ${{ vars.WHOSCORED_DELAY_MIN_MS || '2000' }}
          WHOSCORED_DELAY_MAX_MS: ${{ vars.WHOSCORED_DELAY_MAX_MS || '5000' }}
          WHOSCORED_LEAGUE_CONFIGS: ${{ secrets.WHOSCORED_LEAGUE_CONFIGS }}
        run: node dist/run-scraper.js
